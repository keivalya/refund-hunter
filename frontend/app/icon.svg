<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#fafafa" stroke-linecap="square">
  <!-- Favicon: white-on-transparent so it shows correctly in dark browser
       chrome (the most common case). The dasharray math here matches
       design/mark-cut.svg exactly. -->
  <circle
    cx="32" cy="32" r="22"
    stroke-width="3.5"
    stroke-dasharray="58.6 10.5"
    stroke-dashoffset="12.02"
  />
  <line
    x1="50.4" y1="13.6" x2="13.6" y2="50.4"
    stroke-width="4.5"
  />
</svg>
