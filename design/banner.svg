<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Refund Hunter">
  <!-- Hero banner.
       Style: accent-on-dark — the "active / celebration" treatment.
       Layout: solid dark canvas + emerald wordmark (mark + "refund hunter")
       centered both ways. Wordmark uses the same Direction 1 geometry as
       components/logo.tsx so the brand stays consistent across web and repo.
  -->

  <!-- Background -->
  <rect width="1280" height="320" fill="#0a0a0a" />

  <!-- Subtle full-width hairline above + below for hero rhythm.
       Quiet, almost invisible. Real products have this kind of secondary
       structure that you don't notice but that makes the whole thing feel
       composed. -->
  <line x1="80" y1="60" x2="1200" y2="60" stroke="#10b981" stroke-opacity="0.16" stroke-width="1" />
  <line x1="80" y1="260" x2="1200" y2="260" stroke="#10b981" stroke-opacity="0.16" stroke-width="1" />

  <!-- Wordmark group — scaled 2.1875× from the 280×64 wordmark viewBox,
       giving ~140px display height. Positioned so the wordmark's content
       (which spans y=12..52 internally) is vertically centered on y=160. -->
  <g transform="translate(334, 90) scale(2.1875)">
    <!-- Mark: cut circle + diagonal slash. Same dasharray math as logo.tsx. -->
    <g fill="none" stroke="#10b981" stroke-linecap="square"
       transform="translate(0,12) scale(0.625)">
      <circle cx="32" cy="32" r="22"
        stroke-width="3.2"
        stroke-dasharray="58.6 10.5"
        stroke-dashoffset="12.02" />
      <line x1="50.4" y1="13.6" x2="13.6" y2="50.4"
        stroke-width="4" />
    </g>
    <!-- Wordmark text -->
    <text x="52" y="32"
      fill="#10b981"
      font-family="Geist, -apple-system, system-ui, sans-serif"
      font-size="32"
      font-weight="600"
      letter-spacing="-0.64"
      dominant-baseline="central">refund hunter</text>
  </g>

  <!-- Tagline — restrained, muted gray, mono. Sits below the wordmark
       within the hairline frame. -->
  <text x="640" y="237"
    fill="#737373"
    font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="14"
    letter-spacing="0.04em"
    text-anchor="middle">cancel what you can't · phone · browser · email</text>
</svg>
