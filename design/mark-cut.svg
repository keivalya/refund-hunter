<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="square">
  <!-- Direction 1: The Cut.
       Circle (the recurring loop) with two gaps centered at upper-right
       and lower-left, where the slash passes through. The slash sits on
       top, clearly severing the loop.

       Geometry:
         circle r=22 at (32,32), circumference = 2π*22 ≈ 138.23
         dash 58.6 / gap 10.5 / dash 58.6 / gap 10.5
         dashoffset 12.02 centers the gaps at 135° and 315° (LL and UR
         intersections of the slash with the circle).
         slash from (50.4,13.6) to (13.6,50.4), passing through center.
   -->
  <circle
    cx="32" cy="32" r="22"
    stroke-width="2"
    stroke-dasharray="58.6 10.5"
    stroke-dashoffset="12.02"
    vector-effect="non-scaling-stroke"
  />
  <line
    x1="50.4" y1="13.6" x2="13.6" y2="50.4"
    stroke-width="2.5"
    vector-effect="non-scaling-stroke"
  />
</svg>
